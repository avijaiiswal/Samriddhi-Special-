<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>For Samriddhi 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500;1,600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--rg:#e8b4a0;--gd:#f3d9a4;--bl:#f7c6d0;--cr:#fff4e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 110%,#4a1a3d,#1a1033 45%,#0a0a1f 80%);color:var(--cr);font:400 1.2rem/1.6 'Cormorant Garamond',serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.sc{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vh 7vw;opacity:0;pointer-events:none;transition:opacity 1.4s}.sc.on{opacity:1;pointer-events:auto}#s2.on,#s5.on{pointer-events:none}#s5 button{pointer-events:auto}
.scr{font:400 clamp(3rem,16vw,6.5rem)/1.1 'Great Vibes',cursive;color:var(--bl);text-shadow:0 0 30px #e8b4a066}
.sm{font:600 .7rem Manrope;letter-spacing:.4em;text-transform:uppercase;color:var(--gd);opacity:.85}
#go{margin-top:3rem;width:124px;height:124px;border-radius:50%;border:1px solid #f3d9a488;background:radial-gradient(circle,#f7c6d033,transparent 70%);color:var(--cr);font:600 .65rem Manrope;letter-spacing:.3em;text-transform:uppercase;animation:pu 2.4s infinite}
@keyframes pu{50%{box-shadow:0 0 0 22px #f7c6d010,0 0 40px #f7c6d055;transform:scale(1.05)}}
#ln{font:italic 400 clamp(1.7rem,6vw,2.8rem)/1.3 'Cormorant Garamond';max-width:30rem;opacity:0;transition:opacity 1.2s;text-wrap:balance}#ln.on{opacity:1}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);font:600 .62rem Manrope;letter-spacing:.35em;text-transform:uppercase;opacity:.6}
#s2 .sm{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6vh)}
#mc{position:absolute;left:6vw;right:6vw;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);margin:auto;max-width:28rem;padding:1.2rem 1.4rem;background:#1a1033ee;border:1px solid #f3d9a455;border-radius:18px;opacity:0;transform:translateY(20px);transition:.6s;pointer-events:none}#mc.on{opacity:1;transform:none;pointer-events:auto}
#mc img{display:block;width:100%;max-height:34vh;object-fit:cover;object-position:50% 25%;border:6px solid #fff4e6;border-bottom-width:20px;border-radius:4px;transform:rotate(-2deg);margin:0 0 .9rem;box-shadow:0 10px 30px #0008}#mc small{font:600 .65rem Manrope;letter-spacing:.35em;text-transform:uppercase;color:var(--gd)}#mc p{font:italic 400 1.35rem/1.45 'Cormorant Garamond';margin-top:.4rem}
/* envelope */
#s3 .sc,#s3{perspective:1100px}#s3.on #env{animation:ein 2s cubic-bezier(.2,.8,.2,1),flo 5s 2s ease-in-out infinite}
@keyframes ein{from{opacity:0;transform:translateY(60px) scale(.4) rotate(-12deg)}}@keyframes flo{50%{translate:0 -12px}}
#env{position:relative;width:min(84vw,440px);aspect-ratio:3/2;perspective:900px;transform:rotateX(calc(var(--ry,0)*-12deg)) rotateY(calc(var(--rx,0)*16deg));filter:drop-shadow(0 0 40px #f7c6d044)}
#env .bk{position:absolute;inset:0;background:linear-gradient(160deg,#ecc9aa,#d9a98a);border-radius:6px;box-shadow:0 30px 60px #000a}
#ltr{position:absolute;left:7%;right:7%;top:5%;bottom:4%;border-radius:4px;background:#fffaf0 repeating-linear-gradient(transparent 0 20px,#c9a06a40 20px 21px);transition:transform 1.5s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 0 1px #d9b98a66}#ltr.up{transform:translateY(-62%)}
#env .pk{position:absolute;inset:0;background:linear-gradient(#e6bf9f,#cf9c7e);clip-path:polygon(0 100%,0 0,50% 60%,100% 0,100% 100%);z-index:3}
#env .fl{position:absolute;left:0;top:0;width:100%;height:60%;background:linear-gradient(#efd0b2,#d6a283);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.1s cubic-bezier(.6,0,.2,1);z-index:4}
#env.open .fl{transform:rotateX(180deg);z-index:1;transition:transform 1.1s cubic-bezier(.6,0,.2,1),z-index 0s .5s}
#sw{position:absolute;left:50%;top:58%;width:66px;height:66px;translate:-50% -50%;z-index:6;touch-action:none;display:grid;place-items:center}
#sw i{font-style:normal;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#ffd9de;font-size:1.6rem;background:radial-gradient(circle at 35% 30%,#ff7a8a,#b3122e 60%,#6e0a1c);box-shadow:0 6px 14px #0008,inset 0 0 8px #0006;animation:sp2 1.8s infinite}
@keyframes sp2{50%{box-shadow:0 6px 14px #0008,0 0 24px #ff7a8a}}#sw svg{position:absolute;inset:-14px;width:94px;height:94px;transform:rotate(-90deg);overflow:visible}
#sw.br i{animation:br .9s forwards}@keyframes br{to{transform:scale(1.7) rotate(40deg);opacity:0;filter:blur(6px)}}
/* letter */
.paper{position:relative;width:min(90vw,520px);max-height:68vh;overflow:auto;padding:2.2rem 1.8rem 1.4rem;color:#5b3a2e;text-align:left;border-radius:6px;background:radial-gradient(ellipse at 30% 10%,#fffaf0,#f5e4c8 70%,#e8cfa6);box-shadow:0 30px 80px #000c,0 0 90px #f7c6d055,inset 0 0 60px #c9a06a44;border:1px solid #d9b98a;scrollbar-width:none}
#s4.on .paper{animation:pin 1.8s cubic-bezier(.2,.8,.2,1)}@keyframes pin{from{transform:translateY(40vh) scale(.45) rotateX(45deg);opacity:0}}
.paper p{font:italic 500 clamp(1.15rem,4.3vw,1.45rem)/1.55 'Cormorant Garamond';opacity:0;filter:blur(6px);transform:translateY(10px);transition:1.4s;min-height:.8rem}.paper p.in{opacity:1;filter:none;transform:none}
.paper p.h{font:400 2.5rem 'Great Vibes';color:#9a3b52}.sg{font:400 2.8rem 'Great Vibes';color:#9a3b52;margin-top:.4rem;opacity:0;transition:opacity 1.6s}.sg.on,.btn.on{opacity:1}
.btn{display:inline-block;margin:.5rem;padding:1rem 1.8rem;border-radius:40px;border:1px solid var(--gd);background:#ffffff0a;color:var(--cr);font:600 .72rem Manrope;letter-spacing:.22em;text-transform:uppercase;text-decoration:none}
.btn.p{background:linear-gradient(135deg,#e8b4a0,#f7c6d0);color:#3a1530;border:0;box-shadow:0 0 30px #f7c6d055}#nx{opacity:0;transition:opacity 1.2s;margin-top:1.2rem}
#s5{justify-content:space-between;padding:9vh 7vw 5vh}#q{font:italic 600 clamp(2rem,8.5vw,3.8rem)/1.15 'Cormorant Garamond';text-wrap:balance}
#s6 p{max-width:26rem;margin:.6rem 0 1rem}#rp{max-width:24rem;padding:.9rem 1.1rem;border:1px dashed #f3d9a477;border-radius:14px;font-style:italic;font-size:1.1rem;margin-bottom:1.2rem;user-select:text;-webkit-user-select:text}
#ts{position:fixed;left:50%;bottom:16vh;translate:-50% 0;background:#fff4e6;color:#3a1530;padding:.7rem 1.2rem;border-radius:30px;font:600 .72rem Manrope;opacity:0;transition:opacity .5s;z-index:9;pointer-events:none;white-space:nowrap}#ts.on{opacity:1}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#05030acc)}
#mu{display:none;position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:10;width:42px;height:42px;border-radius:50%;border:1px solid #f3d9a488;background:#1a103399;color:#fff4e6;font-size:1.1rem}
.gar{display:flex;gap:10px;justify-content:center;margin-bottom:1rem;position:relative;padding-top:14px}.gar:before{content:"";position:absolute;left:3%;right:3%;top:6px;height:2px;background:linear-gradient(90deg,transparent,#f3d9a4,transparent);box-shadow:0 0 12px #f3d9a4}
.gar img{width:20vw;max-width:84px;aspect-ratio:3/4;object-fit:cover;border:4px solid #fff4e6;border-bottom-width:12px;border-radius:2px;transform:rotate(var(--r));transform-origin:top center;animation:sw 4s ease-in-out infinite;box-shadow:0 6px 18px #0008}@keyframes sw{50%{transform:rotate(calc(var(--r)*-1))}}

<canvas id="c"></canvas>
<section id="s0" class="sc on"><div class="sm">a little something for</div><h1 class="scr" id="to"></h1><button id="go">tap to begin</button></section>
<section id="s1" class="sc"><p id="ln"></p><div class="hint">tap to continue</div></section>
<section id="s2" class="sc"><div class="sm">touch the stars ✦ <b id="cnt">0</b>/<span id="tot"></span></div><div id="mc"></div></section>

<section id="s4" class="sc"><div class="paper" id="pp"><div id="pl"></div><div class="sg" id="sg"></div></div><button class="btn p" id="nx">continue ♥</button></section>

<section id="s6" class="sc"></section><button id="mu">🔊</button><div id="ts"></div>
