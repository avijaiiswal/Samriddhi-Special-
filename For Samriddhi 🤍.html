<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>For Samriddhi 🤍</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500;1,600&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--rg:#e8b4a0;--gd:#f3d9a4;--bl:#f7c6d0;--cr:#fff4e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{margin:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 110%,#4a1a3d,#1a1033 45%,#0a0a1f 80%);color:var(--cr);font:400 1.2rem/1.6 'Cormorant Garamond',serif;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%}
.sc{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vh 7vw;opacity:0;pointer-events:none;transition:opacity 1.4s}.sc.on{opacity:1;pointer-events:auto}#s2.on,#s5.on{pointer-events:none}#s5 button{pointer-events:auto}
.scr{font:400 clamp(3rem,16vw,6.5rem)/1.1 'Great Vibes',cursive;color:var(--bl);text-shadow:0 0 30px #e8b4a066}
.sm{font:600 .7rem Manrope;letter-spacing:.4em;text-transform:uppercase;color:var(--gd);opacity:.85}
#go{margin-top:3rem;width:124px;height:124px;border-radius:50%;border:1px solid #f3d9a488;background:radial-gradient(circle,#f7c6d033,transparent 70%);color:var(--cr);font:600 .65rem Manrope;letter-spacing:.3em;text-transform:uppercase;animation:pu 2.4s infinite}
@keyframes pu{50%{box-shadow:0 0 0 22px #f7c6d010,0 0 40px #f7c6d055;transform:scale(1.05)}}
#ln{font:italic 400 clamp(1.7rem,6vw,2.8rem)/1.3 'Cormorant Garamond';max-width:30rem;opacity:0;transition:opacity 1.2s;text-wrap:balance}#ln.on{opacity:1}
.hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 5vh);font:600 .62rem Manrope;letter-spacing:.35em;text-transform:uppercase;opacity:.6}
#s2 .sm{position:absolute;top:calc(env(safe-area-inset-top,0px) + 6vh)}
#mc{position:absolute;left:6vw;right:6vw;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);margin:auto;max-width:28rem;padding:1.2rem 1.4rem;background:#1a1033ee;border:1px solid #f3d9a455;border-radius:18px;opacity:0;transform:translateY(20px);transition:.6s;pointer-events:none}#mc.on{opacity:1;transform:none;pointer-events:auto}
#mc small{font:600 .65rem Manrope;letter-spacing:.35em;text-transform:uppercase;color:var(--gd)}#mc p{font:italic 400 1.35rem/1.45 'Cormorant Garamond';margin-top:.4rem}
/* envelope */
#s3 .sc,#s3{perspective:1100px}#s3.on #env{animation:ein 2s cubic-bezier(.2,.8,.2,1),flo 5s 2s ease-in-out infinite}
@keyframes ein{from{opacity:0;transform:translateY(60px) scale(.4) rotate(-12deg)}}@keyframes flo{50%{translate:0 -12px}}
#env{position:relative;width:min(84vw,440px);aspect-ratio:3/2;perspective:900px;transform:rotateX(calc(var(--ry,0)*-12deg)) rotateY(calc(var(--rx,0)*16deg));filter:drop-shadow(0 0 40px #f7c6d044)}
#env .bk{position:absolute;inset:0;background:linear-gradient(160deg,#ecc9aa,#d9a98a);border-radius:6px;box-shadow:0 30px 60px #000a}
#ltr{position:absolute;left:7%;right:7%;top:5%;bottom:4%;border-radius:4px;background:#fffaf0 repeating-linear-gradient(transparent 0 20px,#c9a06a40 20px 21px);transition:transform 1.5s cubic-bezier(.2,.7,.2,1);box-shadow:0 0 0 1px #d9b98a66}#ltr.up{transform:translateY(-62%)}
#env .pk{position:absolute;inset:0;background:linear-gradient(#e6bf9f,#cf9c7e);clip-path:polygon(0 100%,0 0,50% 60%,100% 0,100% 100%);z-index:3}
#env .fl{position:absolute;left:0;top:0;width:100%;height:60%;background:linear-gradient(#efd0b2,#d6a283);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform 1.1s cubic-bezier(.6,0,.2,1);z-index:4}
#env.open .fl{transform:rotateX(180deg);z-index:1;transition:transform 1.1s cubic-bezier(.6,0,.2,1),z-index 0s .5s}
#sw{position:absolute;left:50%;top:58%;width:66px;height:66px;translate:-50% -50%;z-index:6;touch-action:none;display:grid;place-items:center}
#sw i{font-style:normal;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#ffd9de;font-size:1.6rem;background:radial-gradient(circle at 35% 30%,#ff7a8a,#b3122e 60%,#6e0a1c);box-shadow:0 6px 14px #0008,inset 0 0 8px #0006;animation:sp2 1.8s infinite}
@keyframes sp2{50%{box-shadow:0 6px 14px #0008,0 0 24px #ff7a8a}}#sw svg{position:absolute;inset:-14px;width:94px;height:94px;transform:rotate(-90deg);overflow:visible}
#sw.br i{animation:br .9s forwards}@keyframes br{to{transform:scale(1.7) rotate(40deg);opacity:0;filter:blur(6px)}}
/* letter */
.paper{position:relative;width:min(90vw,520px);max-height:68vh;overflow:auto;padding:2.2rem 1.8rem 1.4rem;color:#5b3a2e;text-align:left;border-radius:6px;background:radial-gradient(ellipse at 30% 10%,#fffaf0,#f5e4c8 70%,#e8cfa6);box-shadow:0 30px 80px #000c,0 0 90px #f7c6d055,inset 0 0 60px #c9a06a44;border:1px solid #d9b98a;scrollbar-width:none}
#s4.on .paper{animation:pin 1.8s cubic-bezier(.2,.8,.2,1)}@keyframes pin{from{transform:translateY(40vh) scale(.45) rotateX(45deg);opacity:0}}
.paper p{font:italic 500 clamp(1.15rem,4.3vw,1.45rem)/1.55 'Cormorant Garamond';opacity:0;filter:blur(6px);transform:translateY(10px);transition:1.4s;min-height:.8rem}.paper p.in{opacity:1;filter:none;transform:none}
.paper p.h{font:400 2.5rem 'Great Vibes';color:#9a3b52}.sg{font:400 2.8rem 'Great Vibes';color:#9a3b52;margin-top:.4rem;opacity:0;transition:opacity 1.6s}.sg.on,.btn.on{opacity:1}
.btn{display:inline-block;margin:.5rem;padding:1rem 1.8rem;border-radius:40px;border:1px solid var(--gd);background:#ffffff0a;color:var(--cr);font:600 .72rem Manrope;letter-spacing:.22em;text-transform:uppercase;text-decoration:none}
.btn.p{background:linear-gradient(135deg,#e8b4a0,#f7c6d0);color:#3a1530;border:0;box-shadow:0 0 30px #f7c6d055}#nx{opacity:0;transition:opacity 1.2s;margin-top:1.2rem}
#s5{justify-content:space-between;padding:9vh 7vw 5vh}#q{font:italic 600 clamp(2rem,8.5vw,3.8rem)/1.15 'Cormorant Garamond';text-wrap:balance}
#s6 p{max-width:26rem;margin:.6rem 0 1rem}#rp{max-width:24rem;padding:.9rem 1.1rem;border:1px dashed #f3d9a477;border-radius:14px;font-style:italic;font-size:1.1rem;margin-bottom:1.2rem;user-select:text;-webkit-user-select:text}
#ts{position:fixed;left:50%;bottom:16vh;translate:-50% 0;background:#fff4e6;color:#3a1530;padding:.7rem 1.2rem;border-radius:30px;font:600 .72rem Manrope;opacity:0;transition:opacity .5s;z-index:9;pointer-events:none;white-space:nowrap}#ts.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<canvas id="c"></canvas>
<section id="s0" class="sc on"><div class="sm">a little something for</div><h1 class="scr" id="to"></h1><button id="go">tap to begin</button></section>
<section id="s1" class="sc"><p id="ln"></p><div class="hint">tap to continue</div></section>
<section id="s2" class="sc"><div class="sm">touch the stars ✦ <b id="cnt">0</b>/<span id="tot"></span></div><div id="mc"></div></section>
<section id="s3" class="sc"><div id="env"><div class="bk"></div><div id="ltr"></div><div class="pk"></div><div class="fl"></div><div id="sw"><svg viewBox="0 0 94 94"><circle cx="47" cy="47" r="43" fill="none" stroke="#f3d9a4" stroke-width="3" stroke-linecap="round" stroke-dasharray="270" stroke-dashoffset="270" id="rg"/></svg><i>♥</i></div></div><div class="hint">press &amp; hold the seal 🤍</div></section>
<section id="s4" class="sc"><div class="paper" id="pp"><div id="pl"></div><div class="sg" id="sg"></div></div><button class="btn p" id="nx">continue ♥</button></section>
<section id="s5" class="sc"><div><div class="scr" id="qn"></div><h2 id="q"></h2></div><div class="hint" id="qh" style="position:static;margin-top:0">press &amp; hold the heart if your answer is yes 🤍</div><button class="btn" id="no">I need some time</button></section>
<section id="s6" class="sc"></section><div id="ts"></div>
<script>
// ---- EDIT ME: everything personal lives here ----
const CFG={to:'Samriddhi',from:'Abhinav',ig:'https://www.instagram.com/https_mishra7111?xtok=MWl0cTg1M2thbDJtMA==',
intro:['Samriddhi…','Before anything, take a deep breath and smile a little 🤍','Someone made something just for you.','It took a lot of courage to send this.','So please, read it slowly.'],
memories:[['The beginning','I still remember how it started. I had no idea it would become my favourite chapter.'],['Your laugh','Your laugh is the one sound that can fix my entire day.'],['Our talks','Somehow every conversation with you feels like home.'],['The little things','The way you care about small things, that is when I knew.'],['Your smile','I have tried, but I cannot stop smiling when you do.'],['You','Not because of one moment, but because of every moment with you.']],
letter:['Samriddhi,','','I rewrote this a hundred times,','and no word felt big enough.','','Somewhere between random chats and long talks,','you quietly became my favourite person.','','You make ordinary days feel special,','and heavy days feel lighter.','','I am not perfect, but I can promise you','honesty, respect, and someone','who is always on your side.','','So today, with a nervous heart','and the biggest smile,','I want to ask you something…'],
q:'Will you be mine?',
yes:['Thank you 🥹','You just made Abhinav the happiest person in the world.','I saw everything, Abhinav… my answer is YES 🥹🤍'],
wait:['Take all the time you need','Whatever you decide, Abhinav values you and your friendship more than anything. No pressure, ever.','Hey Abhinav, I saw what you made. Thank you for it. Can we talk? 🤍']};
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches,rnd=(a,b)=>a+Math.random()*(b-a),vib=p=>navigator.vibrate&&navigator.vibrate(p);
$('#to').textContent=CFG.to;$('#qn').textContent=CFG.to+',';$('#q').textContent=CFG.q;$('#tot').textContent=CFG.memories.length;
let mode='gate',MX=0,MY=0,fast=0,sk=()=>{},hold=0,holdQ=0,sealP=0,prog=0,nv=0;
const wait=ms=>new Promise(r=>{const t=setTimeout(r,ms);sk=()=>{clearTimeout(t);r()}}),show=id=>document.querySelectorAll('.sc').forEach(e=>e.classList.toggle('on',e.id==id)),toast=t=>{$('#ts').textContent=t;$('#ts').classList.add('on');setTimeout(()=>$('#ts').classList.remove('on'),3500)};
const cv=$('#c'),x=cv.getContext('2d'),dpr=Math.min(devicePixelRatio,2);let W,H;
const rs=()=>{W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)};rs();addEventListener('resize',rs);
addEventListener('pointermove',e=>{MX=e.clientX/innerWidth-.5;MY=e.clientY/innerHeight-.5;document.documentElement.style.setProperty('--rx',MX);document.documentElement.style.setProperty('--ry',MY)});
const ST=[...Array(RM?60:170)].map(()=>({x:Math.random(),y:Math.random(),r:rnd(.4,1.5),p:rnd(0,6),z:rnd(.2,1)})),mh=i=>({x:Math.random()*W,y:i?Math.random()*H:H+20,s:rnd(6,16),v:rnd(.25,.7),p:rnd(0,6),a:rnd(.1,.35)}),HT=[...Array(RM?8:22)].map(()=>mh(1)),FP=[],CH=[];
const hpath=(cx,cy,s)=>{x.beginPath();x.moveTo(cx,cy+s*.35);x.bezierCurveTo(cx-s,cy-s*.2,cx-s*.5,cy-s,cx,cy-s*.45);x.bezierCurveTo(cx+s*.5,cy-s,cx+s,cy-s*.2,cx,cy+s*.35)},heart=(cx,cy,s)=>{hpath(cx,cy,s);x.fill()};
const MS=CFG.memories.map(([a,b],i)=>({a,b,rev:0,t:i/CFG.memories.length*Math.PI*2})),hp=t=>{const k=Math.min(W,H*.9)/36;return[W/2+16*Math.sin(t)**3*k,H*.44-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*k]},QS=()=>Math.min(W,H)*.36;
let fillA=0,ss=null,sn=0;
function drawQ(s0){const S=QS()*(1+(.04+.05*prog)*Math.sin(s0*(4+prog*5))),cx=W/2,cy=H*.5;
for(let i=0;i<3;i++){const u=(s0*.6+i/3)%1;x.globalAlpha=(.12+.25*prog)*(1-u);x.strokeStyle='#f7c6d0';x.lineWidth=1.5;x.beginPath();x.arc(cx,cy,S*(.8+u*.9),0,7);x.stroke()}
x.globalAlpha=1;x.shadowColor='#f7c6d0';x.shadowBlur=30+40*prog;hpath(cx,cy,S);x.strokeStyle='#f7c6d0';x.lineWidth=2.5;x.stroke();x.shadowBlur=0;x.fillStyle='rgba(247,198,208,.07)';x.fill();
x.save();hpath(cx,cy,S);x.clip();const top=cy+S*.4-S*1.3*prog,g=x.createLinearGradient(0,top,0,cy+S);g.addColorStop(0,'#fff4e6');g.addColorStop(.3,'#f7c6d0');g.addColorStop(1,'#e8758f');x.fillStyle=g;x.beginPath();x.moveTo(cx-S*1.3,cy+S);for(let i=0;i<=24;i++)x.lineTo(cx-S*1.3+i/24*S*2.6,top+Math.sin(s0*3+i*.5)*5);x.lineTo(cx+S*1.3,cy+S);x.fill();x.restore();
if(holdQ&&Math.random()<.5){const a=rnd(0,6.283);FP.push({x:cx+Math.cos(a)*S*.8,y:cy+Math.sin(a)*S*.6,vx:Math.cos(a)*1.5,vy:Math.sin(a)*1.5-1,l:.7,c:'#f3d9a4'})}
const h=prog>.7?'almost there… 🤍':prog>.25?'keep holding… 🤍':'press & hold the heart if your answer is yes 🤍';if($('#qh').textContent!=h)$('#qh').textContent=h}
function frame(t){x.clearRect(0,0,W,H);const s0=t/1000;
ST.forEach(s=>{x.globalAlpha=.3+.7*Math.abs(Math.sin(s0*s.z+s.p));x.fillStyle='#fff4e6';x.beginPath();x.arc(s.x*W+MX*24*s.z,s.y*H+MY*24*s.z,s.r,0,7);x.fill()});
if(!ss&&s0>sn&&mode!='cele'){ss={x:rnd(.3,1)*W,y:rnd(0,.3)*H,l:0};sn=s0+rnd(4,8)}
if(ss){ss.l+=.02;const g=x.createLinearGradient(ss.x,ss.y,ss.x+90,ss.y-45);x.globalAlpha=1-ss.l;g.addColorStop(0,'#fff');g.addColorStop(1,'rgba(255,255,255,0)');x.strokeStyle=g;x.lineWidth=2;x.beginPath();x.moveTo(ss.x-ss.l*260,ss.y+ss.l*130);x.lineTo(ss.x-ss.l*260+90,ss.y+ss.l*130-45);x.stroke();if(ss.l>1)ss=null}
HT.forEach((h,i)=>{h.y-=h.v;h.x+=Math.sin(s0+h.p)*.3;x.globalAlpha=h.a;x.fillStyle='#f7c6d0';heart(h.x,h.y,h.s);if(h.y<-20)HT[i]=mh(0)});
if(mode=='mem'||mode=='wait'){const all=MS.every(m=>m.rev);if(all){fillA=Math.min(1,fillA+.008);x.globalAlpha=fillA*(.14+.05*Math.sin(s0*3));x.fillStyle='#f7c6d0';x.beginPath();for(let i=0;i<=60;i++){const[a,b]=hp(i/60*Math.PI*2);i?x.lineTo(a,b):x.moveTo(a,b)}x.fill()}
x.globalAlpha=.8;x.strokeStyle='#f7c6d0';x.lineWidth=1.6;x.shadowColor='#f7c6d0';x.shadowBlur=12;x.beginPath();MS.forEach((m,i)=>{const n=MS[(i+1)%MS.length];if(m.rev&&n.rev&&(i<MS.length-1||all)){x.moveTo(...hp(m.t));x.lineTo(...hp(n.t))}});x.stroke();x.shadowBlur=0;
MS.forEach(m=>{const[px,py]=hp(m.t),p=1+.18*Math.sin(s0*3+m.t),r=(m.rev?11:8)*p,g=x.createRadialGradient(px,py,0,px,py,r*3.4);g.addColorStop(0,m.rev?'rgba(247,198,208,.9)':'rgba(243,217,164,.8)');g.addColorStop(1,'rgba(243,217,164,0)');x.globalAlpha=1;x.fillStyle=g;x.fillRect(px-r*4,py-r*4,r*8,r*8);x.fillStyle=m.rev?'#f7c6d0':'#fff4e6';x.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4,d=k%2?r*.35:r;k?x.lineTo(px+Math.cos(a)*d,py+Math.sin(a)*d):x.moveTo(px+d,py)}x.fill()})}
if(mode=='env'){sealP=Math.max(0,Math.min(1,sealP+(hold?.011:-.02)));$('#rg').style.strokeDashoffset=270*(1-sealP);if(sealP>=1)openEnv()}
if(mode=='q'){prog=Math.max(0,Math.min(1,prog+(holdQ?.0075:-.012)));drawQ(s0);if(prog>=1)end(1)}
if((hold||holdQ)&&s0>nv){vib(14);nv=s0+(mode=='q'?1.1-.6*prog:.3)}
CH.forEach((h,i)=>{h.y+=h.v;h.x+=Math.sin(s0*2+h.p);x.globalAlpha=.85;x.fillStyle=h.c;heart(h.x,h.y,h.s);if(h.y>H+30)CH.splice(i,1)});
FP.forEach((p,i)=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.l-=.012;x.globalAlpha=Math.max(0,p.l);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,2,0,7);x.fill();if(p.l<=0)FP.splice(i,1)});
x.globalAlpha=1;requestAnimationFrame(frame)}requestAnimationFrame(frame);
const boom=(px,py)=>{const c=['#f7c6d0','#f3d9a4','#e8b4a0','#fff4e6'][rnd(0,4)|0];for(let i=0;i<(RM?24:64);i++){const a=Math.random()*6.283,v=rnd(1,5);FP.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}};
function celebrate(){vib([60,40,60,40,120]);let n=0;const iv=setInterval(()=>{boom(rnd(.15,.85)*W,rnd(.12,.5)*H);for(let i=0;i<10;i++)CH.push({x:rnd(0,W),y:-20,s:rnd(8,18),v:rnd(1,3),p:rnd(0,6),c:['#f7c6d0','#e8b4a0','#f3d9a4'][i%3]});if(++n>30)clearInterval(iv)},450)}
// ---- the story ----
const mc=$('#mc');
addEventListener('pointerup',()=>{hold=holdQ=0});addEventListener('pointercancel',()=>{hold=holdQ=0});
$('#sw').addEventListener('pointerdown',()=>{if(mode=='env')hold=1});
addEventListener('pointerdown',e=>{sk();fast=1;
if(mode=='q'&&Math.hypot(e.clientX-W/2,e.clientY-H*.5)<QS()*1.1)holdQ=1;
if(mode!='mem')return;if(mc.classList.contains('on')){mc.classList.remove('on');if(MS.every(m=>m.rev))toEnv();return}
let b=null,d=44;MS.forEach(m=>{const[px,py]=hp(m.t),k=Math.hypot(e.clientX-px,e.clientY-py);if(k<d){d=k;b=m}});if(!b)return;vib(25);if(!b.rev){b.rev=1;$('#cnt').textContent=MS.filter(m=>m.rev).length}mc.innerHTML=`<small>${b.a}</small><p>${b.b}</p>`;mc.classList.add('on')});
async function toEnv(){mode='wait';await wait(2600);boom(W/2,H*.44);boom(W/2,H*.44);show('s3');mode='env'}
async function openEnv(){mode='open';vib([40,30,90]);const r=$('#sw').getBoundingClientRect();boom(r.left+33,r.top+33);boom(r.left+33,r.top+33);$('#sw').classList.add('br');$('#env').classList.add('open');await wait(1300);$('#ltr').classList.add('up');await wait(1700);show('s4');mode='read';await wait(1500);
const L=$('#pl');for(const [i,t] of CFG.letter.entries()){const p=document.createElement('p');p.textContent=t;if(!i)p.className='h';L.appendChild(p);void p.offsetWidth;p.classList.add('in');$('#pp').scrollTo({top:1e5,behavior:'smooth'});if(!fast)await wait(t?1300:500)}
$('#sg').textContent='— '+CFG.from;$('#sg').classList.add('on');$('#pp').scrollTo({top:1e5,behavior:'smooth'});await wait(1800);$('#nx').classList.add('on')}
$('#go').onclick=async()=>{$('#go').disabled=true;vib(30);mode='intro';show('s1');const ln=$('#ln');for(const t of CFG.intro){ln.textContent=t;ln.classList.add('on');await wait(RM?1500:3200);ln.classList.remove('on');await wait(1000)}show('s2');await wait(800);mode='mem'};
$('#nx').onclick=()=>{show('s5');mode='q'};
function end(ok){if(mode=='end')return;mode='end';holdQ=0;const c=ok?CFG.yes:CFG.wait;show('s6');
$('#s6').innerHTML=`<div class="scr" style="font-size:clamp(2.6rem,12vw,5rem)">${c[0]}</div><p>${c[1]}</p><div id="rp">${c[2]}</div><a class="btn p" id="ig" target="_blank" rel="noopener" href="${CFG.ig}">💌 Reply on Instagram</a><p style="font-size:1rem;opacity:.7;margin:.3rem 0 .6rem">${ok?CFG.from+' is probably refreshing Instagram right now 😭':'Tap above to open Instagram'}</p><button class="btn" onclick="location.reload()">Replay</button>`;
$('#ig').onclick=()=>{try{navigator.clipboard.writeText(c[2]);toast('Reply copied — paste it in the DM 💌')}catch(e){toast('Copy your reply above and send it 💌')}};
if(ok){boom(W/2,H*.5);boom(W/2,H*.4);celebrate()}}
$('#no').onclick=()=>end(0);
</script></body></html>
